name: Validate app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test update validation
        run: python3 -m unittest discover -s tests -v
      - name: Validate shell syntax
        run: sh -n syncclipboard_server/run.sh
      - name: Build candidate
        run: docker build --pull -t syncclipboard-ha:test syncclipboard_server
      - name: Verify real service and persistent data
        run: python3 scripts/verify.py --image syncclipboard-ha:test
